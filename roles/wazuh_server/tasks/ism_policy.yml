---
# One retention policy (see wazuh_ism_policies), looped from ism.yml.
# All requests run inside the indexer container; port 9200 is never published.
- name: Read the current retention policy ({{ wazuh_ism.id }})
  community.docker.docker_container_exec:
    container: "{{ wazuh_indexer_container }}"
    argv:
      - sh
      - -c
      - >-
        curl -sk -u "admin:${INDEXER_ADMIN_PASSWORD}"
        "https://localhost:9200/_plugins/_ism/policies/${ISM_POLICY_ID}"
    env:
      INDEXER_ADMIN_PASSWORD: "{{ vault_indexer_admin_password }}"
      ISM_POLICY_ID: "{{ wazuh_ism.id }}"
  register: wazuh_ism_current
  changed_when: false
  check_mode: false
  no_log: true

- name: Compare with the wanted retention ({{ wazuh_ism.id }})
  ansible.builtin.set_fact:
    wazuh_ism_exists: "{{ '\"_seq_no\"' in wazuh_ism_current.stdout }}"
    wazuh_ism_in_sync: >-
      {{ ('"min_index_age":"' ~ wazuh_ism.days ~ 'd"') in (wazuh_ism_current.stdout | replace(' ', ''))
         and ('"' ~ wazuh_ism.pattern ~ '"') in wazuh_ism_current.stdout }}

- name: Create or update the retention policy ({{ wazuh_ism.id }})
  community.docker.docker_container_exec:
    container: "{{ wazuh_indexer_container }}"
    argv:
      - sh
      - -c
      - >-
        curl -sk -o /dev/null -w '%{http_code}' -u "admin:${INDEXER_ADMIN_PASSWORD}"
        -X PUT -H 'Content-Type: application/json' --data-binary @-
        "https://localhost:9200/_plugins/_ism/policies/${ISM_POLICY_ID}${ISM_QUERY}"
    stdin: "{{ lookup('ansible.builtin.template', 'ism-retention.json.j2') | from_yaml | to_json }}"
    env:
      INDEXER_ADMIN_PASSWORD: "{{ vault_indexer_admin_password }}"
      ISM_POLICY_ID: "{{ wazuh_ism.id }}"
      ISM_QUERY: >-
        {{ ('?if_seq_no=' ~ (wazuh_ism_current.stdout | from_json)._seq_no
        ~ '&if_primary_term=' ~ (wazuh_ism_current.stdout | from_json)._primary_term)
        if wazuh_ism_exists | bool else '' }}
  register: wazuh_ism_put
  when: not (wazuh_ism_in_sync | bool)
  failed_when: wazuh_ism_put.stdout | trim not in ['200', '201']
  changed_when: true
  no_log: true

# New indices pick the policy up through its ism_template; these two cover existing ones.
- name: Attach the policy to existing indices ({{ wazuh_ism.pattern }})
  community.docker.docker_container_exec:
    container: "{{ wazuh_indexer_container }}"
    argv:
      - sh
      - -c
      - >-
        curl -sk -u "admin:${INDEXER_ADMIN_PASSWORD}"
        -X POST -H 'Content-Type: application/json' --data-binary @-
        "https://localhost:9200/_plugins/_ism/add/${ISM_PATTERN}"
    stdin: "{{ {'policy_id': wazuh_ism.id} | to_json }}"
    env:
      INDEXER_ADMIN_PASSWORD: "{{ vault_indexer_admin_password }}"
      ISM_PATTERN: "{{ wazuh_ism.pattern }}"
  register: wazuh_ism_add
  changed_when: (wazuh_ism_add.stdout | from_json).updated_indices | default(0) | int > 0
  no_log: true

- name: Move already-managed indices to the updated policy ({{ wazuh_ism.pattern }})
  community.docker.docker_container_exec:
    container: "{{ wazuh_indexer_container }}"
    argv:
      - sh
      - -c
      - >-
        curl -sk -u "admin:${INDEXER_ADMIN_PASSWORD}"
        -X POST -H 'Content-Type: application/json' --data-binary @-
        "https://localhost:9200/_plugins/_ism/change_policy/${ISM_PATTERN}"
    stdin: "{{ {'policy_id': wazuh_ism.id} | to_json }}"
    env:
      INDEXER_ADMIN_PASSWORD: "{{ vault_indexer_admin_password }}"
      ISM_PATTERN: "{{ wazuh_ism.pattern }}"
  when:
    - wazuh_ism_put is changed
    - wazuh_ism_exists | bool
  changed_when: true
  no_log: true
