---
- name: Import the Wazuh GPG key
  ansible.builtin.rpm_key:
    key: "{{ wazuh_agent_repo_gpg_key }}"
    state: present

# The repository is left disabled and only enabled for the pinned install below. That is
# Wazuh's documented way to stop `dnf upgrade` moving the agent ahead of the manager, and it
# needs no versionlock plugin.
- name: Add the Wazuh yum repository (disabled)
  ansible.builtin.yum_repository:
    name: wazuh
    description: Wazuh repository
    baseurl: "{{ wazuh_agent_yum_repo }}"
    gpgcheck: true
    gpgkey: "{{ wazuh_agent_repo_gpg_key }}"
    enabled: false

- name: Check for an existing enrollment
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: wazuh_agent_client_keys

- name: Install the pinned wazuh-agent package
  ansible.builtin.dnf:
    name: "wazuh-agent-{{ wazuh_version }}-{{ wazuh_agent_package_revision }}"
    state: present
    enablerepo: wazuh
  environment: >-
    {{
      {
        'WAZUH_MANAGER': wazuh_manager_address,
        'WAZUH_AGENT_GROUP': wazuh_agent_group,
        'WAZUH_AGENT_NAME': wazuh_agent_name
      } | combine(
        {} if (wazuh_agent_client_keys.stat.exists and wazuh_agent_client_keys.stat.size > 0)
        else {'WAZUH_REGISTRATION_PASSWORD': vault_agent_enrollment_password}
      )
    }}
  register: wazuh_agent_install
  no_log: true

- name: Configure and start the agent
  ansible.builtin.include_tasks: linux_common.yml
