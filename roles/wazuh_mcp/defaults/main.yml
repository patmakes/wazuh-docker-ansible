---
# gensecaihq/Wazuh-MCP-Server. Upstream's supported Wazuh range is 4.8.0-4.14.7; this repo
# deploys 4.14.8, so compatibility is confirmed only by the smoke test in VERIFY.md.
wazuh_mcp_version: "5.0.0"
wazuh_mcp_image: "ghcr.io/gensecaihq/wazuh-mcp-server:{{ wazuh_mcp_version }}"

wazuh_mcp_https_port: 8443
wazuh_mcp_compose_file: "{{ wazuh_deploy_dir }}/docker-compose.mcp.yml"

# Least-privilege accounts created on the manager API and the indexer.
wazuh_mcp_api_user: mcp-readonly
wazuh_mcp_indexer_user: mcp-readonly
wazuh_mcp_indexer_role: mcp-readonly
wazuh_mcp_indexer_index_patterns:
  - "wazuh-alerts-*"
  - "wazuh-states-vulnerabilities-*"
wazuh_mcp_indexer_allowed_actions:
  - read
  - search

# Lifetime of JWTs minted at POST /auth/token (1-8760 hours). 24 breaks an unattended
# client daily; see README "Token lifetime" for the two options. Not decided here.
wazuh_mcp_token_lifetime_hours: 24

# Server-side tool allow-list, by upstream TOOLSET name (WAZUH_TOOLSETS). Empty = all toolsets.
# Valid: alerts, agents, vulnerabilities, analysis, web_search, compliance, system, response.
wazuh_mcp_tools_allowlist: []
# Individual tool names to hide on top of that (WAZUH_DISABLED_TOOLS).
wazuh_mcp_disabled_tools: []

# Exact-match Origin allow-list. Requests without an Origin header are always accepted.
wazuh_mcp_allowed_origins:
  - "https://{{ wazuh_server_magicdns }}:{{ wazuh_mcp_https_port }}"

# Peers whose X-Forwarded-For uvicorn trusts for the access log (FORWARDED_ALLOW_IPS).
# `tailscale serve` appends the tailnet client to that header and reaches the container through
# the compose network's gateway (pinned by wazuh_docker_gateway). Trusting only that address makes
# uvicorn take the right-most entry, the one tailscale added; "*" would take the left-most, which
# the client controls, and let it pick the address rule 100104 counts by.
# Set "" to turn it off (every request is then logged from the gateway address).
wazuh_mcp_forwarded_allow_ips: "{{ wazuh_docker_gateway }}"

# Rules 100112-100114 match this user name literally: keep roles/wazuh_mcp/files/mcp_rules.xml
# in step if you change wazuh_mcp_api_user.
wazuh_mcp_log_level: INFO
wazuh_mcp_memory_limit: 512M
